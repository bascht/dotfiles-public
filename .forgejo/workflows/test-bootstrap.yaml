---
on: [push]
jobs:
  doom:
    runs-on: docker
    container:
      image: archlinux/archlinux:base-devel-20241120.0.281320
    steps:
      - run: cat /etc/os-release
      - run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm git chezmoi bash zstd tar nodejs systemd
      - uses: actions/checkout@v3
      - run: |
          mkdir -p "${HOME}/.local/share" "${HOME}/.config/chezmoi"
          ln -s "$(pwd)" "${HOME}/.local/share/chezmoi"
          cp "$(pwd)/bootstrap/chezmoi.toml" "${HOME}/.config/chezmoi"
      - run: |
          chezmoi status
          chezmoi apply
