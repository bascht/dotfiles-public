#symbol_map U+E0A0-U+E0A2,U+E0B0-U+E0B3 PowerlineSymbols
include OneHalfLight.conf
inactive_text_alpha 0.75

#include theme-modus-operandi.conf
linux_display_server wayland

allow_remote_control yes
listen_on unix:/run/user/1000/kitty

focus_follows_mouse true
paste_actions quote-urls-at-prompt
shell_integration enabled

window_border_width 2
window_padding_width 5
#draw_minimal_borders no
#window_margin_width 5
cursor_trail 0

map ctrl+o>r reload

map ctrl+o>ctrl+l goto_tab -1

map ctrl+o>h neighboring_window left
map ctrl+o>j neighboring_window bottom
map ctrl+o>k neighboring_window top
map ctrl+o>l neighboring_window right

map ctrl+o>shift+h move_window left
map ctrl+o>shift+j move_window bottom
map ctrl+o>shift+k move_window top
map ctrl+o>shift+l move_window right

map --new-mode mw ctrl+o>m>w

# Switch focus to the neighboring window in the indicated direction using arrow keys
map --mode mw left neighboring_window left
map --mode mw right neighboring_window right
map --mode mw up neighboring_window up
map --mode mw down neighboring_window down

# Move the active window in the indicated direction
map --mode mw shift+up move_window up
map --mode mw shift+left move_window left
map --mode mw shift+right move_window right
map --mode mw shift+down move_window down

# Resize the active window
map --mode mw n resize_window narrower
map --mode mw w resize_window wider
map --mode mw t resize_window taller
map --mode mw s resize_window shorter

# Exit the manage window mode
map --mode mw esc pop_keyboard_mode


enabled_layouts splits,fat,grid,stack,tall,vertical,horizontal

map ctrl+o>d>w detach_window
map ctrl+o>d>t detach_tab

map ctrl+o>y launch --type=os-window --os-window-class=launcher --allow-remote-control kitty +kitten broadcast


dim_opacity 0.5
mouse_hide_wait 10.0
hide_window_decorations yes

enable_audio_bell no

confirm_os_window_close -1

tab_bar_style separator


tab_separator " "

#tab_activity_symbol "OOOOO"
tab_bar_min_tabs 2
tab_title_template "({index}) {title}"
# active_tab_title_template "({index}) {title}"
active_tab_font_style bold

# Emacs keys
map kitty_mod+-
map kitty_mod++
# Fzf keys
#map ctrl+t

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 combine : launch kitten @ env "KUBECONFIG=$KUBECONFIG" : launch --location=hsplit k9s
map ctrl+o>1 goto_tab 1
map ctrl+o>2 goto_tab 2
map ctrl+o>3 goto_tab 3
map ctrl+o>4 goto_tab 4
map ctrl+o>5 goto_tab 5
map ctrl+o>6 goto_tab 6
map ctrl+o>7 goto_tab 7
map ctrl+o>8 goto_tab 8
map ctrl+o>9 goto_tab 9
map ctrl+o>0 goto_tab 1


# map ctrl+o>1 first_window
# map ctrl+o>2 second_window
# map ctrl+o>3 third_window
# map ctrl+o>4 fourth_window
# map ctrl+o>5 fifth_window
# map ctrl+o>6 sixth_window
# map ctrl+o>7 seventh_window
# map ctrl+o>8 eighth_window
# map ctrl+o>9 nineth_window

map ctrl+o>ctrl+o previous_window

map ctrl+o>p previous_tab
map ctrl+o>n next_tab
map ctrl+o>ctrl+p move_tab_backward
map ctrl+o>ctrl+n move_tab_forward

#map ctrl+t new_tab
#map ctrl+w close_tab

map ctrl+o>r load_config_file
map ctrl+o>z toggle_layout stack

#tab_title_template "{' #' if layout_name == 'stack' else '  '}{fmt.fg.red}{bell_symbol}{fmt.fg.tab}{title}  "
#tab_title_template "{' #' if layout_name == 'stack' else '  '}{index}: {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title}  "
tab_title_template "{' #' if layout_name == 'stack' else '  '}{index}: {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title}  "

map ctrl+o>i show_scrollback
map ctrl+o>s launch --location=hsplit --cwd=current
map ctrl+o>v launch --location=vsplit --cwd=current
map ctrl+o>c new_tab_with_cwd
map ctrl+o>space next_layout

map ctrl+o>j next_window
map ctrl+o>k previous_window
#new_window_with_cwd

#font_family Knack Nerd Font
#font_family JetBrainsMono Nerd Font
font_family "JetBrainsMono Nerd Font"
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size 11.0




cursor_shape block
url_color #0087BD
url_style curly
map ctrl+plus change_font_size current +1.0
map ctrl+minus change_font_size current -1.0
# map ctrl+shift+plus change_font_size all +1.0
# map ctrl+shift+minus change_font_size all -1.0

